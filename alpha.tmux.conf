# Pleiades Alpha tmux config
# 2026-05-25 主人要求：滑鼠捲動 + 加大 scrollback buffer

# ===== 滑鼠模式 =====
# 啟用滑鼠：滾輪直接向上向下捲動歷史（自動進 copy mode）
# 點擊 pane 切換焦點、拖曳選取文字
set -g mouse on

# ===== Scrollback 緩衝 =====
# 預設 history-limit 2000 行太少，加大到 10 萬行
# 注意：對「已經產生的歷史」沒效（只影響新增的 lines）
set -g history-limit 100000

# ===== Copy mode 鍵綁定（vi 風格） =====
setw -g mode-keys vi

# vi 風格選取（按 v 開始選，y 複製）
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "pbcopy"

# 滑鼠拖曳結束自動複製到 macOS clipboard（pbcopy）
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# 滑鼠中鍵點擊貼上
bind-key -T copy-mode-vi MouseDown2Pane paste-buffer

# ===== Page Up 直接進 copy mode 並翻頁（不必先 Ctrl+B [）=====
bind-key -n PageUp copy-mode -u

# ===== 終端機真彩支援 =====
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ===== 雜項：訊息提示與 escape time =====
# 縮短 escape time（vim/neovim 響應更快）
set -sg escape-time 10

# 訊息顯示時間（毫秒）
set -g display-time 2000
